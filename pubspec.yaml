name: health_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts / Data
  fl_chart: ^0.69.0
  crypto: ^3.0.0
  intl: ^0.19.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.13.4
  path_provider: ^2.1.4

  # Notifications / Permissions
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.2
  permission_handler: ^11.0.0

  # Animations
  animations: ^2.0.11
  flutter_animate: ^4.5.2
  rive: ^0.13.10

  # Audio
  audioplayers: ^5.2.1
  just_audio: ^0.9.37

  # UI / Utils
  curved_navigation_bar: ^1.0.6
  share_plus: ^10.0.0
  flutter_slidable: ^3.1.0
  path: ^1.9.0
  getwidget: ^7.0.0

  # Image picking
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # ✅ 你的资源目录（保留整个 images 文件夹）
  assets:
    - assets/images/

# ✅ App 图标生成（适配 iOS 上架：去掉透明通道 alpha）
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true